name: Review updated map snapshots
on:
  push:
    branches: ['codex/frozen-throne-landing']
    paths: ['.github/workflows/map-snapshot-review.yml']
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_ENABLE_DEMO: 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture screenshot candidates against updated 2.5D composition
        run: npx playwright test e2e/map.spec.ts --grep 'visual baselines cover' --update-snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-snapshot-candidates
          path: frontend/e2e/map.spec.ts-snapshots/
          retention-days: 7
