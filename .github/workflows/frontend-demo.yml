name: Frontend demo build (isolated)
on:
  push:
    branches:
      - 'frontend/**'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-demo.yml'
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
