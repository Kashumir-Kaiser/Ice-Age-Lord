name: Frontend demo build (isolated)
on:
  push:
    branches:
      - 'frontend/**'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-demo.yml'
  # GitHub only executes scheduled workflows from the default branch.\n  # Kept here as a ready-to-enable schedule without modifying main.\n  # 17:00 UTC = 00:00 Asia/Ho_Chi_Minh (UTC+7), next calendar day.\n  schedule:\n    - cron: '0 17 * * *'\n  workflow_dispatch:
concurrency:
  group: frontend-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-visual-qa
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
