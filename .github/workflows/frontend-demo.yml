name: Stage 02–10 regression and release journeys
on:
  push:
    branches:
      - main
      - work
      - 'frontend/**'
      - 'codex/**'
    paths:
      - 'frontend/**'
      - 'packages/**'
      - 'references/canonical/**'
      - 'design/current/**'
      - 'data/events/EVENT-SOURCE-CATALOG-v4.6.json'
      - 'data/events/EVENT-SOURCE-ITEMS-v4.6.csv'
      - 'data/events/EVENT-SOURCE-ITEMS-v7.24.csv'
      - 'data/events/EVENT-SOURCE-CATALOG-v7.25-ADDENDUM.json'
      - 'data/events/EVENT-TIMELINE-v0.6.json'
      - 'data/structures/SOURCE-STRUCTURE-CATALOG-v1.0.json'
      - 'docs/FRESH_START.md'
      - 'docs/implementation/**'
      - 'assets/**'
      - 'package.json'
      - '.github/workflows/frontend-demo.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'packages/**'
      - 'references/canonical/**'
      - 'design/current/**'
      - 'data/events/EVENT-SOURCE-CATALOG-v4.6.json'
      - 'data/events/EVENT-SOURCE-ITEMS-v4.6.csv'
      - 'data/events/EVENT-SOURCE-ITEMS-v7.24.csv'
      - 'data/events/EVENT-SOURCE-CATALOG-v7.25-ADDENDUM.json'
      - 'data/events/EVENT-TIMELINE-v0.6.json'
      - 'data/structures/SOURCE-STRUCTURE-CATALOG-v1.0.json'
      - 'docs/FRESH_START.md'
      - 'docs/implementation/**'
      - 'assets/**'
      - 'package.json'
      - '.github/workflows/frontend-demo.yml'
  workflow_dispatch:
concurrency:
  group: frontend-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run content:compile
      - run: npm run content:coverage:stage08
      - run: npm run test:stage02
      - run: npm run test:stage03
      - run: npm run test:stage04
      - run: npm run test:stage05
      - run: npm run test:stage06
      - run: npm run test:stage07
      - run: npm run test:stage08
      - run: npm run test:stage09
      - run: npm run test:stage10
  frontend:
    needs: backend
    runs-on: ubuntu-latest
    env:
      VITE_GAME_MODE: demo
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Prepare test local API
        run: |
          cd ..
          npm run owner:key:create
          npm run db:migrate
          ILL_TEST_OWNER_KEY="$(cat .local/owner-key)"
          echo "::add-mask::$ILL_TEST_OWNER_KEY"
          echo "ILL_TEST_OWNER_KEY=$ILL_TEST_OWNER_KEY" >> "$GITHUB_ENV"
      - name: Start test local API
        run: |
          cd ..
          nohup env ILL_ALLOWED_ORIGIN=http://localhost:5173 npm run api:start > /tmp/ill-api.log 2>&1 < /dev/null &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8081/api/v1/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ill-api.log
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-visual-qa
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
