name: Asset and frontend validation
run-name: Frontend TSX/Vite validation for ${{ github.ref_name }}
on:
  push:
    branches: [main, work]
    paths:
      - 'assets/**'
      - 'frontend/**'
      - '.github/workflows/assets-frontend.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
