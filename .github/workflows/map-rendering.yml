name: Map rendering validation
on:
  push:
    branches: [work, main, 'codex/**']
    paths: ['frontend/**', 'assets/**', '.github/workflows/map-rendering.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_GAME_MODE: demo
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Capture unmodified map baseline
        run: node scripts/map-baseline.mjs
      - name: Prepare pinned renderer toolchain
        if: always()
        run: |
          npm install --save-exact pixi.js@8.10.2 --no-audit --no-fund
          npm install --save-dev --save-exact @resvg/resvg-js@2.6.2 sharp@0.34.5 --no-audit --no-fund
          tar -czf /tmp/map-toolchain.tar.gz node_modules package.json package-lock.json
          split -b 20M -d /tmp/map-toolchain.tar.gz /tmp/map-toolchain.part
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-baseline
          path: |
            frontend/map-evidence/baseline/
            frontend/dist/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-toolchain-00
          path: /tmp/map-toolchain.part00
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-toolchain-01
          path: /tmp/map-toolchain.part01
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-toolchain-02
          path: /tmp/map-toolchain.part02
