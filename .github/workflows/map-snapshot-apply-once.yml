name: Apply reviewed 2.5D map screenshot once
on:
  push:
    branches: ['codex/frozen-throne-landing']
    paths: ['.github/workflows/map-snapshot-apply-once.yml']
permissions:
  contents: write
  actions: read
jobs:
  approved-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download independently reviewed snapshot from run 38683295826
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38683295826 --repo "$GITHUB_REPOSITORY" --name map-snapshot-candidates --dir /tmp/map-snapshot-candidates
      - name: Verify approved screenshot exact SHA-256 and update only the outdated heat baseline
        run: |
          src=/tmp/map-snapshot-candidates/desktop-heat-25km-chromium-linux.png
          printf '%s  %s\n' '7332a0c463cae9738a9a1b2fc08242e7d81ef752b90d39a88c4db7ab196b4c15' "$src" | sha256sum -c -
          cp "$src" frontend/e2e/map.spec.ts-snapshots/desktop-heat-25km-chromium-linux.png
          git diff --name-only -- frontend/e2e/map.spec.ts-snapshots/
          git add frontend/e2e/map.spec.ts-snapshots/desktop-heat-25km-chromium-linux.png
      - name: Commit reviewed reference image to landing branch only
        run: |
          if git diff --cached --quiet; then
            echo 'Baseline already matches reviewed candidate'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(map): refresh reviewed 25km desktop golden image after 2.5D overhaul'
          git push origin HEAD:codex/frozen-throne-landing
