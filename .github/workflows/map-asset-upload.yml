name: Persist map asset checkpoint
on:
  push:
    branches: ['codex/map-25d-overhaul']
    paths: ['assets/source/uploads/manifest.json', 'assets/map-building-views.json', 'frontend/scripts/export-map-assets.mjs', 'frontend/scripts/trim-map-raster.mjs', 'frontend/scripts/map-orientation-export.mjs', 'frontend/scripts/normalize-map-alpha.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: map-asset-checkpoint
  cancel-in-progress: false
jobs:
  persist:
    if: github.ref == 'refs/heads/codex/map-25d-overhaul'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map-25d-overhaul
      - name: Verify and restore original generated bytes
        run: python scripts/restore-map-upload.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Rebuild registered map derivatives from preserved masters
        run: npm run assets:map
        working-directory: frontend
      - name: Commit and push originals and derivatives to the map branch
        run: |
          test "$(git branch --show-current)" = codex/map-25d-overhaul
          git add -A assets/source assets/manifest.json frontend/public/assets/manifest.json frontend/public/assets/map
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Persist verified original map artwork from checkpoint transfer'
          git push origin HEAD:codex/map-25d-overhaul
      - run: npm run build && npm test
        working-directory: frontend
        env:
          VITE_GAME_MODE: demo
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Validate map interactions on the restored checkpoint
        run: npm run test:e2e -- e2e/map-rendering.spec.ts e2e/territory.spec.ts e2e/map.spec.ts --grep-invert 'visual baselines'
        working-directory: frontend
        env:
          VITE_GAME_MODE: demo
          PLAYWRIGHT_PREVIEW: '1'
      - name: Capture restored art for review
        if: always() && !cancelled()
        run: node scripts/map-qa.mjs
        working-directory: frontend
      - name: Measure benchmark diagnostics
        run: node scripts/map-benchmark.mjs
        working-directory: frontend
        env:
          MAP_BENCH_SECONDS: '5'
          MAP_BENCH_RUNS: '1'
          MAP_BENCH_WARMUP: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-restored-captures
          path: frontend/map-evidence/after/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-restored-diagnostics
          path: frontend/map-evidence/benchmark/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-restored-interactions
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
