name: Map performance evidence
on:
  push:
    branches: ['codex/map-25d-overhaul']
    paths: ['frontend/src/rendering/**', 'frontend/scripts/map-benchmark.mjs', 'frontend/scripts/map-memory.mjs', 'frontend/scripts/map-browser.mjs', 'frontend/scripts/map-fixture-server.mjs', '.github/workflows/map-performance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        quality: [low, normal]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Restore checkpoint artwork when this push contains a transfer
        run: python scripts/restore-map-upload.py
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run assets:map && npm run build
        env:
          VITE_GAME_MODE: demo
      - run: npx playwright install --with-deps chromium
      - name: Warmed production pan experiments, 60 seconds, three runs
        run: node scripts/map-benchmark.mjs
        env:
          MAP_BENCH_SECONDS: '60'
          MAP_BENCH_RUNS: '3'
          MAP_BENCH_WARMUP: '10'
          MAP_BENCH_QUALITY: '${{ matrix.quality }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-performance-${{ matrix.quality }}
          path: |
            frontend/map-evidence/benchmark/
            frontend/map-evidence/memory/
          retention-days: 14

  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        quality: [low, normal]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/restore-map-upload.py
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run assets:map && npm run build
        env:
          VITE_GAME_MODE: demo
      - run: npx playwright install --with-deps chromium
      - name: Two identical twenty-return memory cycles
        run: node scripts/map-memory.mjs
        env:
          MAP_BENCH_QUALITY: '${{ matrix.quality }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-memory-${{ matrix.quality }}
          path: frontend/map-evidence/memory/
          retention-days: 14
