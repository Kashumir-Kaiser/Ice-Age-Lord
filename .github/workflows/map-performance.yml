name: Map performance evidence
on:
  push:
    branches: ['codex/map-25d-overhaul']
    paths: ['frontend/src/rendering/**', 'frontend/src/territory/**', 'frontend/src/LiveApp.tsx', 'frontend/src/live/**', 'frontend/scripts/map-benchmark.mjs', 'frontend/scripts/map-benchmark-summary.mjs', 'frontend/scripts/map-memory.mjs', 'frontend/scripts/map-browser.mjs', 'frontend/scripts/map-fixture-server.mjs', 'frontend/scripts/map-cpu-profile.mjs', 'frontend/scripts/map-cpu-profile-summary.mjs', 'frontend/scripts/map-trace-dense-pan.mjs', '.github/workflows/map-performance.yml']
  workflow_dispatch:
    inputs:
      profile_dense_pan:
        description: 'Run a bounded CDP CPU profile for a dense-520 pan'
        required: false
        default: false
        type: boolean
      trace_dense_pan:
        description: 'Run a bounded Chromium timeline trace for a dense-520 pan'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        quality: [low, normal]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Restore checkpoint artwork when this push contains a transfer
        run: python scripts/restore-map-upload.py
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run assets:map && npm run build
        env:
          VITE_GAME_MODE: demo
      - run: npx playwright install --with-deps chromium
      - name: Warmed production pan experiments, 60 seconds, three runs
        run: node scripts/map-benchmark.mjs
        env:
          MAP_BENCH_SECONDS: '60'
          MAP_BENCH_RUNS: '3'
          MAP_BENCH_WARMUP: '10'
          MAP_BENCH_QUALITY: '${{ matrix.quality }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-performance-${{ matrix.quality }}
          path: |
            frontend/map-evidence/benchmark/
            frontend/map-evidence/memory/
          retention-days: 14

  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        quality: [low, normal]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/restore-map-upload.py
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run assets:map && npm run build
        env:
          VITE_GAME_MODE: demo
      - run: npx playwright install --with-deps chromium
      - name: Two identical twenty-return memory cycles
        run: node scripts/map-memory.mjs
        env:
          MAP_BENCH_QUALITY: '${{ matrix.quality }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-memory-${{ matrix.quality }}
          path: frontend/map-evidence/memory/
          retention-days: 14

  cpu-profile:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/codex/map-25d-overhaul') || (github.event_name == 'workflow_dispatch' && inputs.profile_dense_pan == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Restore checkpoint artwork when this push contains a transfer
        run: python scripts/restore-map-upload.py
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run assets:map && npm run build -- --sourcemap
        env:
          VITE_GAME_MODE: demo
      - run: npx playwright install --with-deps chromium
      - name: Capture bounded dense-520 pan CPU profile
        run: node scripts/map-cpu-profile.mjs
        env:
          MAP_CPU_PROFILE_SECONDS: '8'
          MAP_CPU_PROFILE_QUALITY: 'low'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-cpu-profile-dense-520-pan
          path: frontend/map-evidence/cpu-profile/
          retention-days: 14

  trace-dense-pan:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/codex/map-25d-overhaul') || (github.event_name == 'workflow_dispatch' && inputs.trace_dense_pan == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Restore checkpoint artwork when this push contains a transfer
        run: python scripts/restore-map-upload.py
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run assets:map && npm run build -- --sourcemap
        env:
          VITE_GAME_MODE: demo
      - run: npx playwright install --with-deps chromium
      - name: Capture bounded dense-520 pan Chromium trace
        run: node scripts/map-trace-dense-pan.mjs
        env:
          MAP_TRACE_SECONDS: '8'
          MAP_TRACE_QUALITY: 'low'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-trace-dense-520-pan
          path: frontend/map-evidence/trace/
          retention-days: 14
